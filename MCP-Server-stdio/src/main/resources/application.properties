spring.application.name=mcp-server-stdio

# --- H2 Database (file-based) ---
spring.datasource.url=jdbc:h2:file:C:/data/helpdesk
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=debjit
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- Enable H2 Console (optional for debugging) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- this config will not allow to start as web application ---
spring.main.web-application-type=none
logging.level.root=ERROR
spring.main.banner-mode=off